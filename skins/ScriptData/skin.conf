# This skin generates nothing.  It exists so that fields read by something
# that is not a report -- a shell script, an SNMP extension, a monitoring
# check -- have a report of their own to be declared under, instead of
# being parked on a page's report where they do not belong.
#
# There is deliberately no [Generators] section: WeeWX runs no generator
# for this report.  Do not add one.
#
# Declare your fields in weewx.conf, NOT here: this file is replaced on
# every upgrade of weewx-loopdata, and anything you add would be lost.
#
#   [StdReport]
#       [[ScriptData]]
#           enable = true
#           [[[LoopData]]]
#               [[[[fields]]]]
#                   my_script = current.extraTemp2.raw
#
# The values then arrive in the loop-data file under "ScriptData", so a
# script reads d["ScriptData"]["current.extraTemp2.raw"].  Full
# instructions:
# https://chaunceygardiner.github.io/weewx-loopdata/declaring-fields.html#fields-for-scripts-and-other-non-report-consumers
