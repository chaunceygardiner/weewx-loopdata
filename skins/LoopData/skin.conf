# The page's language: WeeWX merges lang/<lang>.conf over this skin.conf.
# Danish, German, Spanish, French, Italian, Dutch, Norwegian (Bokmal) and
# Swedish ship (lang/da.conf, de.conf, es.conf, fr.conf, it.conf, nl.conf,
# no.conf, sv.conf); override per report in weewx.conf.
lang = en

[Extras]
    version = 6.11.1

    # File path of loop data file.  If not a full path,
    # it will be interpreted as relative to this skin's HTML_ROOT.
    loop_data_file = '../loop-data.txt'

    # Refresh rate is the rate at which the report should refresh with
    # the latest readings.  A good choice is the rate at which your
    # weather stations driver is feeding loop data.  Expressed in units
    # of seconds.  Default: 2 seconds.
    refresh_rate = 2

    # Choose your own password.  Without ?pageUpdate=xxx at the end of
    # the URL (xxx being this password), auto updating will time out.
    # Note the URL parameter is pageUpdate, not page_update_pwd.
    # Note: This password will be visible to users looking
    # at page source in their browser.
    page_update_pwd = 'foobar'

    # Page expiration time is the number of hours the report will request
    # loop data and update.  After which, a mouse click will be needed
    # to start refreshing again.  Default 4 hours.
    expiration_time = 4

    # If you have a google analytics id, uncomment the following line
    # and fill in the ID.
    # googleAnalyticsId =
    # If you only want to use the ID on a certain host, uncomment the
    # following line and fill in the hostname.
    # analytics_host = www.example.com

[CheetahGenerator]
    encoding = html_entities
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

[CopyGenerator]
    copy_once = favicon.ico
    copy_always = ,

[Generators]
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
