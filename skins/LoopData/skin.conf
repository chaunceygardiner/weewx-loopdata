# The page's language: WeeWX merges lang/<lang>.conf over this skin.conf.
# Danish, German, Spanish, French, Italian, Dutch, Norwegian (Bokmal) and
# Swedish ship (lang/da.conf, de.conf, es.conf, fr.conf, it.conf, nl.conf,
# no.conf, sv.conf); override per report in weewx.conf.
lang = en

[Extras]
    version = 7.0

    # File path of loop data file.  If not a full path,
    # it will be interpreted as relative to this skin's HTML_ROOT.
    # The default matches the default [LoopData] [[FileSpec]]
    # loop_data_dir = . , which writes the file beside this page.
    loop_data_file = 'loop-data.txt'

    # Refresh rate is the rate at which the report should refresh with
    # the latest readings.  A good choice is the rate at which your
    # weather stations driver is feeding loop data.  Expressed in units
    # of seconds.  Default: 2 seconds.
    refresh_rate = 2

    # Choose your own password.  Without ?pageUpdate=xxx at the end of
    # the URL (xxx being this password), auto updating will time out.
    # Note the URL parameter is pageUpdate, not page_update_pwd.
    # Note: This password will be visible to users looking
    # at page source in their browser.
    page_update_pwd = 'foobar'

    # Page expiration time is the number of hours the report will request
    # loop data and update.  After which, a mouse click will be needed
    # to start refreshing again.  Default 4 hours.
    expiration_time = 4

    # If you have a google analytics id, uncomment the following line
    # and fill in the ID.
    # googleAnalyticsId =
    # If you only want to use the ID on a certain host, uncomment the
    # following line and fill in the hostname.
    # analytics_host = www.example.com

# The fields this page reads, declared to weewx-loopdata (7.0 and later),
# which writes them into the loop-data file under this report's name.
# Named groups, one per gauge, in the order the page lays them out; a field
# two gauges share is listed under both.  The groups exist because ConfigObj
# has no line continuation for lists -- their names are for the reader.
# Keep in step with the manual's "What each gauge reads".
[LoopData]
    [[fields]]
        # The timestamp and the LIVE indicator.
        clock       = current.dateTime.raw
        # Today's windrose, plus the automatic windrose.bands legend helper.
        windrose    = day.windrose.banded, day.windrose.calm
        wind        = current.windSpeed, current.windSpeed.raw, current.windDir.raw, current.windDir.ordinal_compass, 10m.windGust.max, 10m.wind.gustdir.raw, 10m.wind.gustdir.ordinal_compass
        temperature = current.outTemp, current.outTemp.raw, day.outTemp.min.raw, day.outTemp.max.raw, day.outTemp.min.formatted, day.outTemp.max.formatted
        dewpoint    = current.dewpoint, current.dewpoint.raw, day.dewpoint.min.raw, day.dewpoint.max.raw, day.dewpoint.min.formatted, day.dewpoint.max.formatted
        humidity    = current.outHumidity, current.outHumidity.raw, day.outHumidity.min.raw, day.outHumidity.max.raw
        barometer   = current.barometer, current.barometer.raw, trend.barometer.raw, trend.barometer.desc
        rain        = day.rain.sum, day.rain.sum.raw, current.rainRate, current.rainRate.raw
        rain_rate   = current.rainRate, current.rainRate.raw, day.rainRate.max, day.rainRate.max.raw
        # The gauges below hide themselves on stations that do not report
        # the observation.
        feels_like  = current.appTemp, current.appTemp.raw, day.appTemp.min.raw, day.appTemp.max.raw, day.appTemp.min.formatted, day.appTemp.max.formatted
        uv          = current.UV, current.UV.raw, day.UV.max
        radiation   = current.radiation, current.radiation.raw, day.radiation.max
        air_quality = current.pm2_5, current.pm2_5_aqi.raw, current.pm2_5_aqi.formatted
        # The dial scales.
        labels      = unit.label.outTemp, unit.label.barometer, unit.label.rain, unit.label.rainRate, unit.label.windSpeed

[CheetahGenerator]
    encoding = html_entities
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

[CopyGenerator]
    copy_once = favicon.ico
    copy_always = ,

[Generators]
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
