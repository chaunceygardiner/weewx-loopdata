# The page's language: WeeWX merges lang/<lang>.conf over this skin.conf.
# Danish, German, Spanish, French, Italian, Dutch, Norwegian (Bokmal) and
# Swedish ship (lang/da.conf, de.conf, es.conf, fr.conf, it.conf, nl.conf,
# no.conf, sv.conf); override per report in weewx.conf.
lang = en

[Extras]
    version = 8.0.1

    # File path of loop data file.  If not a full path,
    # it will be interpreted as relative to this skin's HTML_ROOT.
    # The default matches the default [LoopData] [[FileSpec]]
    # loop_data_dir = . , which writes the file beside this page.
    loop_data_file = 'loop-data.txt'

    # Refresh rate is the rate at which the report should refresh with
    # the latest readings.  A good choice is the rate at which your
    # weather stations driver is feeding loop data.  Expressed in units
    # of seconds.  Default: 2 seconds.  Zero, a negative, or anything
    # that is not a number, means the default.
    refresh_rate = 2

    # Which theme the page wears.  auto follows the viewer's own system
    # setting; dark and light pin it regardless of who is looking.
    # Anything unrecognized is treated as auto.  Note that a browser with
    # no preference set reports light, so auto gives such a viewer the
    # light page; set dark to keep the page this skin has always had.
    theme = auto

    # Choose your own password.  Without ?pageUpdate=xxx at the end of
    # the URL (xxx being this password), auto updating will time out.
    # Note the URL parameter is pageUpdate, not page_update_pwd.
    # Any characters work -- spaces, quotes, accents; the URL value is
    # compared both as typed and percent-decoded.
    # Left empty, no URL exempts the page: it expires like any other.
    # Note: This password will be visible to users looking
    # at page source in their browser.
    page_update_pwd = 'foobar'

    # Page expiration time is the number of hours the report will request
    # loop data and update.  After which, a mouse click will be needed
    # to start refreshing again.  Default 24 hours.  Zero means the page
    # never expires; a negative, or anything that is not a number, means
    # the default.
    expiration_time = 24

    # If you have a google analytics id, uncomment the following line
    # and fill in the ID.
    # googleAnalyticsId =
    # If you only want to use the ID on a certain host, uncomment the
    # following line and fill in the hostname.
    # analytics_host = www.example.com

# The fields this page reads, declared to weewx-loopdata (7.0 and later),
# which writes them into the loop-data file under this report's name.
# Named groups, one per gauge, in the order the page lays them out; a field
# two gauges share is listed under both.  The groups exist because ConfigObj
# has no line continuation for lists -- their names are for the reader.
# Keep in step with the manual's "What each gauge reads".
[LoopData]
    [[fields]]
        # The timestamp and the LIVE indicator.
        clock       = current.dateTime.raw
        # Today's windrose, plus the automatic windrose.bands legend helper.
        windrose    = day.windrose.banded, day.windrose.calm
        wind        = current.windSpeed.formatted, current.windSpeed.raw, current.windDir.raw, current.windDir.ordinal_compass, 10m.windGust.max, 10m.windGust.max.raw, 10m.wind.gustdir.raw, 10m.wind.gustdir.ordinal_compass, day.wind.max, day.wind.max.raw, day.wind.vecdir.raw, day.wind.vecdir.ordinal_compass
        temperature = current.outTemp.formatted, current.outTemp.raw, day.outTemp.min.raw, day.outTemp.max.raw, day.outTemp.min.formatted, day.outTemp.max.formatted
        dewpoint    = current.dewpoint.formatted, current.dewpoint.raw, day.dewpoint.min.raw, day.dewpoint.max.raw, day.dewpoint.min.formatted, day.dewpoint.max.formatted
        humidity    = current.outHumidity.formatted, current.outHumidity.raw, day.outHumidity.min.raw, day.outHumidity.max.raw, day.outHumidity.min.formatted, day.outHumidity.max.formatted
        barometer   = current.barometer.formatted, current.barometer.raw, trend.barometer.raw, trend.barometer.desc, day.barometer.min.formatted, day.barometer.max.formatted
        rain        = day.rain.sum.formatted, day.rain.sum.raw, current.rainRate, current.rainRate.raw
        rain_rate   = current.rainRate.formatted, current.rainRate.raw, day.rainRate.max, day.rainRate.max.raw
        # The gauges below hide themselves on stations that do not report
        # the observation.
        feels_like  = current.appTemp.formatted, current.appTemp.raw, day.appTemp.min.raw, day.appTemp.max.raw, day.appTemp.min.formatted, day.appTemp.max.formatted
        uv          = current.UV.formatted, current.UV.raw, day.UV.max, day.UV.max.raw
        radiation   = current.radiation.formatted, current.radiation.raw, day.radiation.max, day.radiation.max.raw
        air_quality = current.pm2_5, current.pm2_5_aqi.raw, current.pm2_5_aqi.formatted
        # The units beside each reading, which also pick the dial scales.
        labels      = unit.label.outTemp, unit.label.outHumidity, unit.label.barometer, unit.label.rain, unit.label.rainRate, unit.label.windSpeed, unit.label.radiation
        # THE GAUGE CARDS (8.0), one group per card, in the order of the
        # gauges above.  A card ranks its reading against each period's
        # low and high (the ladder), so a ranged observation declares
        # min, max, mintime and maxtime for the last hour, the last 24
        # hours, today, this week, this month, this year and all time.
        # Day and week times render through this report's own
        # [Units][TimeFormats]; month, year and all-time extremes carry a
        # date form declared here (quoted: the argument holds a comma).
        # The 24-hour rolling windows are the costly part -- about 10 MB
        # each at two-second packets -- and are kept on every card.
        windrose_card   = hour.windrose.banded, hour.windrose.calm, week.windrose.banded, week.windrose.calm, month.windrose.banded, month.windrose.calm, year.windrose.banded, year.windrose.calm
        wind_card       = day.windSpeed.avg, day.windrun.sum, day.wind.vecavg, day.wind.maxtime, day.wind.gustdir.ordinal_compass, 1h.windSpeed.avg, 1h.windGust.max, 1h.windGust.max.raw, 1h.wind.gustdir.ordinal_compass, 24h.windGust.max, 24h.windGust.max.raw, 24h.wind.gustdir.ordinal_compass, week.wind.max, week.wind.max.raw, week.wind.gustdir.ordinal_compass, week.wind.maxtime, month.wind.max, month.wind.max.raw, month.wind.gustdir.ordinal_compass, 'month.wind.maxtime.format("%b %-d")', year.wind.max, year.wind.max.raw, year.wind.gustdir.ordinal_compass, 'year.wind.maxtime.format("%b %-d")', alltime.wind.max, alltime.wind.max.raw, alltime.wind.gustdir.ordinal_compass, 'alltime.wind.maxtime.format("%b %-d, %Y")', 'alltime.start.format("%Y")'
        temperature_card= trend.outTemp.formatted, day.outTemp.avg.formatted, 1h.outTemp.min.raw, 1h.outTemp.min.formatted, 1h.outTemp.max.raw, 1h.outTemp.max.formatted, 24h.outTemp.min.raw, 24h.outTemp.min.formatted, 24h.outTemp.max.raw, 24h.outTemp.max.formatted, day.outTemp.min.raw, day.outTemp.min.formatted, day.outTemp.mintime, day.outTemp.max.raw, day.outTemp.max.formatted, day.outTemp.maxtime, week.outTemp.min.raw, week.outTemp.min.formatted, week.outTemp.mintime, week.outTemp.max.raw, week.outTemp.max.formatted, week.outTemp.maxtime, month.outTemp.min.raw, month.outTemp.min.formatted, 'month.outTemp.mintime.format("%b %-d")', month.outTemp.max.raw, month.outTemp.max.formatted, 'month.outTemp.maxtime.format("%b %-d")', year.outTemp.min.raw, year.outTemp.min.formatted, 'year.outTemp.mintime.format("%b %-d")', year.outTemp.max.raw, year.outTemp.max.formatted, 'year.outTemp.maxtime.format("%b %-d")', alltime.outTemp.min.raw, alltime.outTemp.min.formatted, 'alltime.outTemp.mintime.format("%b %-d, %Y")', alltime.outTemp.max.raw, alltime.outTemp.max.formatted, 'alltime.outTemp.maxtime.format("%b %-d, %Y")'
        dewpoint_card   = trend.dewpoint.formatted, 1h.dewpoint.min.raw, 1h.dewpoint.min.formatted, 1h.dewpoint.max.raw, 1h.dewpoint.max.formatted, 24h.dewpoint.min.raw, 24h.dewpoint.min.formatted, 24h.dewpoint.max.raw, 24h.dewpoint.max.formatted, day.dewpoint.min.raw, day.dewpoint.min.formatted, day.dewpoint.mintime, day.dewpoint.max.raw, day.dewpoint.max.formatted, day.dewpoint.maxtime, week.dewpoint.min.raw, week.dewpoint.min.formatted, week.dewpoint.mintime, week.dewpoint.max.raw, week.dewpoint.max.formatted, week.dewpoint.maxtime, month.dewpoint.min.raw, month.dewpoint.min.formatted, 'month.dewpoint.mintime.format("%b %-d")', month.dewpoint.max.raw, month.dewpoint.max.formatted, 'month.dewpoint.maxtime.format("%b %-d")', year.dewpoint.min.raw, year.dewpoint.min.formatted, 'year.dewpoint.mintime.format("%b %-d")', year.dewpoint.max.raw, year.dewpoint.max.formatted, 'year.dewpoint.maxtime.format("%b %-d")', alltime.dewpoint.min.raw, alltime.dewpoint.min.formatted, 'alltime.dewpoint.mintime.format("%b %-d, %Y")', alltime.dewpoint.max.raw, alltime.dewpoint.max.formatted, 'alltime.dewpoint.maxtime.format("%b %-d, %Y")'
        humidity_card   = trend.outHumidity.formatted, 1h.outHumidity.min.raw, 1h.outHumidity.min.formatted, 1h.outHumidity.max.raw, 1h.outHumidity.max.formatted, 24h.outHumidity.min.raw, 24h.outHumidity.min.formatted, 24h.outHumidity.max.raw, 24h.outHumidity.max.formatted, day.outHumidity.min.raw, day.outHumidity.min.formatted, day.outHumidity.mintime, day.outHumidity.max.raw, day.outHumidity.max.formatted, day.outHumidity.maxtime, week.outHumidity.min.raw, week.outHumidity.min.formatted, week.outHumidity.mintime, week.outHumidity.max.raw, week.outHumidity.max.formatted, week.outHumidity.maxtime, month.outHumidity.min.raw, month.outHumidity.min.formatted, 'month.outHumidity.mintime.format("%b %-d")', month.outHumidity.max.raw, month.outHumidity.max.formatted, 'month.outHumidity.maxtime.format("%b %-d")', year.outHumidity.min.raw, year.outHumidity.min.formatted, 'year.outHumidity.mintime.format("%b %-d")', year.outHumidity.max.raw, year.outHumidity.max.formatted, 'year.outHumidity.maxtime.format("%b %-d")', alltime.outHumidity.min.raw, alltime.outHumidity.min.formatted, 'alltime.outHumidity.mintime.format("%b %-d, %Y")', alltime.outHumidity.max.raw, alltime.outHumidity.max.formatted, 'alltime.outHumidity.maxtime.format("%b %-d, %Y")'
        barometer_card  = trend.barometer.formatted, 1h.barometer.min.raw, 1h.barometer.min.formatted, 1h.barometer.max.raw, 1h.barometer.max.formatted, 24h.barometer.min.raw, 24h.barometer.min.formatted, 24h.barometer.max.raw, 24h.barometer.max.formatted, day.barometer.min.raw, day.barometer.min.formatted, day.barometer.mintime, day.barometer.max.raw, day.barometer.max.formatted, day.barometer.maxtime, week.barometer.min.raw, week.barometer.min.formatted, week.barometer.mintime, week.barometer.max.raw, week.barometer.max.formatted, week.barometer.maxtime, month.barometer.min.raw, month.barometer.min.formatted, 'month.barometer.mintime.format("%b %-d")', month.barometer.max.raw, month.barometer.max.formatted, 'month.barometer.maxtime.format("%b %-d")', year.barometer.min.raw, year.barometer.min.formatted, 'year.barometer.mintime.format("%b %-d")', year.barometer.max.raw, year.barometer.max.formatted, 'year.barometer.maxtime.format("%b %-d")', alltime.barometer.min.raw, alltime.barometer.min.formatted, 'alltime.barometer.mintime.format("%b %-d, %Y")', alltime.barometer.max.raw, alltime.barometer.max.formatted, 'alltime.barometer.maxtime.format("%b %-d, %Y")'
        rain_card       = 1h.rain.sum, 1h.rain.sum.raw, 24h.rain.sum, 24h.rain.sum.raw, day.rain.sum, week.rain.sum, week.rain.sum.raw, month.rain.sum, month.rain.sum.raw, year.rain.sum, year.rain.sum.raw, rainyear.rain.sum, rainyear.rain.sum.raw, 'rainyear.start.format("%b %-d")', alltime.rain.sum, 'alltime.start.format("%Y")'
        rain_rate_card  = day.rainRate.maxtime, month.rainRate.max, month.rainRate.max.raw, 'month.rainRate.maxtime.format("%b %-d")', year.rainRate.max, year.rainRate.max.raw, 'year.rainRate.maxtime.format("%b %-d")', alltime.rainRate.max, alltime.rainRate.max.raw, 'alltime.rainRate.maxtime.format("%b %-d, %Y")'
        feels_like_card = trend.appTemp.formatted, 1h.appTemp.min.raw, 1h.appTemp.min.formatted, 1h.appTemp.max.raw, 1h.appTemp.max.formatted, 24h.appTemp.min.raw, 24h.appTemp.min.formatted, 24h.appTemp.max.raw, 24h.appTemp.max.formatted, day.appTemp.min.raw, day.appTemp.min.formatted, day.appTemp.mintime, day.appTemp.max.raw, day.appTemp.max.formatted, day.appTemp.maxtime, week.appTemp.min.raw, week.appTemp.min.formatted, week.appTemp.mintime, week.appTemp.max.raw, week.appTemp.max.formatted, week.appTemp.maxtime, month.appTemp.min.raw, month.appTemp.min.formatted, 'month.appTemp.mintime.format("%b %-d")', month.appTemp.max.raw, month.appTemp.max.formatted, 'month.appTemp.maxtime.format("%b %-d")', year.appTemp.min.raw, year.appTemp.min.formatted, 'year.appTemp.mintime.format("%b %-d")', year.appTemp.max.raw, year.appTemp.max.formatted, 'year.appTemp.maxtime.format("%b %-d")', alltime.appTemp.min.raw, alltime.appTemp.min.formatted, 'alltime.appTemp.mintime.format("%b %-d, %Y")', alltime.appTemp.max.raw, alltime.appTemp.max.formatted, 'alltime.appTemp.maxtime.format("%b %-d, %Y")'
        uv_card         = day.UV.maxtime, 1h.UV.avg.formatted, almanac.sun.altitude, almanac.sun.transit, almanac.sunrise, almanac.sunset, almanac.sun.visible.long_form(), week.UV.max, week.UV.max.raw, week.UV.maxtime, month.UV.max, month.UV.max.raw, 'month.UV.maxtime.format("%b %-d")', year.UV.max, year.UV.max.raw, 'year.UV.maxtime.format("%b %-d")', alltime.UV.max, alltime.UV.max.raw, 'alltime.UV.maxtime.format("%b %-d, %Y")'
        radiation_card  = day.radiation.maxtime, 1h.radiation.avg, almanac.sun.azimuth, almanac(horizon=-6).sun(use_center=1).set, 'almanac.sun.visible_change.minute.format("%d")', week.radiation.max, week.radiation.max.raw, week.radiation.maxtime, month.radiation.max, month.radiation.max.raw, 'month.radiation.maxtime.format("%b %-d")', year.radiation.max, year.radiation.max.raw, 'year.radiation.maxtime.format("%b %-d")', alltime.radiation.max, alltime.radiation.max.raw, 'alltime.radiation.maxtime.format("%b %-d, %Y")'
        air_quality_card= 1h.pm2_5.avg, 24h.pm2_5.avg, 24h.pm2_5.max.raw, day.pm2_5.min.raw, day.pm2_5.mintime, day.pm2_5.max.raw, day.pm2_5.maxtime, week.pm2_5.max.raw, week.pm2_5.maxtime, month.pm2_5.max.raw, 'month.pm2_5.maxtime.format("%b %-d")', year.pm2_5.max.raw, 'year.pm2_5.maxtime.format("%b %-d")', alltime.pm2_5.max.raw, 'alltime.pm2_5.maxtime.format("%b %-d, %Y")'

[CheetahGenerator]
    encoding = html_entities
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

[CopyGenerator]
    copy_once = favicon.ico
    copy_always = ,

[Generators]
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
