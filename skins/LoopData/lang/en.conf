# skins/LoopData/lang/en.conf
#
# English -- the sample report's reference dictionary.  Every string the
# page renders is here, and nothing else: tests/test_process_packet.py
# fails if a key rendered by index.html.tmpl or realtime_updater.inc is
# missing from this file, or if this file carries a key nothing renders.
#
# Translations are gettext-style: the English string IS the key, and a
# report falls back to the English, one string at a time, for any key its
# language file does not carry -- a partial translation is fine.
# Composed strings keep their {named} placeholders; translators may
# reorder them but must not rename them.
#
# The [Labels], [Units] and [Almanac] sections below are not rendered by
# the page itself -- they are here because this report is loopdata's
# default TARGET report, and loopdata renders live VALUES in the target
# report's language: .ordinal_compass fields read [[Ordinates]],
# moon_phase fields read moon_phases, almanac.<body>.label and
# almanac.<body>.constellation.label fields read the body names and
# [[Constellations]], and station.latitude/longitude fields read
# hemispheres.  See the manual's Translations page for the coupling.

[Labels]

    # Hemisphere abbreviations, for station.latitude/longitude fields
    hemispheres = N, S, E, W

[Units]

    [[Ordinates]]

        # Compass ordinal directions, for .ordinal_compass fields; the
        # page's wind dial and windrose use N, E, S and W
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW, SW, WSW, W, WNW, NW, NNW, N/A

[Almanac]

    # Moon phase names, for moon_phase loop fields of a loopdata instance
    # whose target report is this one
    moon_phases = New, Waxing crescent, First quarter, Waxing gibbous, Full, Waning gibbous, Last quarter, Waning crescent

    # Body display names, keyed by tag name, for almanac.<body>.label
    # loop fields
    sun = Sun
    moon = Moon
    mercury = Mercury
    venus = Venus
    earth = Earth
    mars = Mars
    jupiter = Jupiter
    saturn = Saturn
    uranus = Uranus
    neptune = Neptune
    pluto = Pluto
    proxima_centauri = Proxima Centauri

