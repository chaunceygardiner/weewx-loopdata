# skins/LoopData/lang/no.conf
#
# Norwegian (Bokmål) -- Norsk.  Beta pending native-speaker review;
# corrections welcome at
# https://github.com/chaunceygardiner/weewx-loopdata/issues
#
# The shared vocabulary -- body names, moon phases, hemispheres, compass
# ordinates, all 88 constellation names, and the live badge strings -- is
# copied verbatim from weewx-skyfield's and weewx-celestial's lang/no.conf
# and must stay in step with them (a test pins this).  The gauge headings
# follow the Norwegian labels of WeeWX's own Seasons skin (Lufttrykk,
# Regn, Regnintensitet, Føles som), with four deliberate departures:
# Temperatur and Doggpunkt drop Seasons' "ute" qualifier (this page
# reads outdoor sensors only), Luftfuktighet replaces "Fuktighet ute"
# (the everyday term, and the same qualifier again), Solinnstråling
# replaces the bare "Stråling" (which loses the sun), and UV-indeks
# takes the hyphen Norwegian compounds want.  The nine
# trend.barometer.desc descriptions use one tendency register
# (stigende, stabilt, fallende); the handful of readout strings only
# this page renders are built from that vocabulary.
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Forkortelser for himmelretningene, for station.latitude/longitude
    hemispheres = N, S, Ø, V

[Units]

    [[Ordinates]]

        # Himmelretninger for .ordinal_compass-felter; vindskalaen og
        # vindrosen på siden bruker N, Ø, S og V.
        # Som i WeeWX' egen no.conf.
        directions = N, NNØ, NØ, ØNØ, Ø, ØSØ, SØ, SSØ, S, SSV, SV, VSV, V, VNV, NV, NNV, N/A

[Almanac]

    # Månefaser, for moon_phase-feltene til en loopdata-instans som har
    # denne rapporten som målrapport.
    # Som i WeeWX' egen no.conf.
    moon_phases = Nymåne, Voksende sigd, Første kvarter, Voksende måne, Fullmåne, Avtakende måne, Siste kvarter, Avtakende sigd

    # Visningsnavn for himmellegemene, nøkkel = tagnavn, for
    # almanac.<body>.label-felter.
    sun = Solen
    moon = Månen
    mercury = Merkur
    venus = Venus
    earth = Jorden
    mars = Mars
    jupiter = Jupiter
    saturn = Saturn
    uranus = Uranus
    neptune = Neptun
    pluto = Pluto
    proxima_centauri = Proxima Centauri

    # Visningsnavn for stjernebildene, nøkkel = IAU-forkortelse, for
    # almanac.<body>.constellation.label-felter (weewx-skyfield).
    # almanac.<body>.constellation gir alltid det latinske navnet.
    # IAU standardiserer bare de latinske navnene; de norske navnene
    # følger Liste over stjernebilder på norsk Wikipedia
    # (https://no.wikipedia.org/wiki/Liste_over_stjernebilder,
    # konsultert 2026-08-06).
