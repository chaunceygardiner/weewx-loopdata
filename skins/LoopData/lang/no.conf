    "Today's Windrose" = "Dagens vindrose"
    "Wind" = "Vind"
    "Temperature" = "Temperatur"
    "Dew Point" = "Doggpunkt"
    "Humidity" = "Luftfuktighet"
    "Barometer" = "Lufttrykk"
    "Rain" = "Regn"
    "Rain Rate" = "Regnintensitet"
    "Feels Like" = "Føles som"
    "UV Index" = "UV-indeks"
    "Solar Radiation" = "Solinnstråling"
    "Air Quality" = "Luftkvalitet"

    # ── live values (read by loopdata itself, from the TARGET report's
