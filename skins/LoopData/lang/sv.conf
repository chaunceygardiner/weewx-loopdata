# skins/LoopData/lang/sv.conf
#
# Swedish -- Svenska.  Beta pending native-speaker review; corrections
# welcome at https://github.com/chaunceygardiner/weewx-loopdata/issues
#
# The shared vocabulary -- body names, moon phases, hemispheres, compass
# ordinates, all 88 constellation names, and the live badge strings -- is
# copied verbatim from weewx-skyfield's and weewx-celestial's lang/sv.conf
# and must stay in step with them (a test pins this).  WeeWX's own
# Seasons skin has no Swedish file, so the gauge headings are translated
# fresh in the register of the Italian and Norwegian files, using SMHI's
# everyday vocabulary (Daggpunkt, Lufttryck, Regnintensitet,
# Solinstrålning, Känns som, UV-index).  The nine trend.barometer.desc
# descriptions use one tendency register (stigande, stabilt, fallande);
# the handful of readout strings only this page renders are built from
# that vocabulary.
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Förkortningar för väderstrecken, för station.latitude/longitude.
    # Svenska koordinater förkortar öster som Ö (östlig längd) …
    hemispheres = N, S, Ö, V

[Units]

    [[Ordinates]]

        # … medan kompassvindarna använder O (ost): nordost NO, sydost
        # SO.  Väderstreck för .ordinal_compass-fälten; sidans vindskala
        # och vindros använder N, O, S och V.
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSV, SV, VSV, V, VNV, NV, NNV, N/A

