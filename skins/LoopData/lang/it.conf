# skins/LoopData/lang/it.conf
#
# Italian -- Italiano.  Beta pending native-speaker review; corrections
# welcome at https://github.com/chaunceygardiner/weewx-loopdata/issues
#
# The shared vocabulary -- body names, moon phases, hemispheres, compass
# ordinates, all 88 constellation names, and the live badge strings -- is
# copied verbatim from weewx-skyfield's and weewx-celestial's lang/it.conf
# and must stay in step with them (a test pins this).  The gauge headings
# follow the Italian labels of WeeWX's own Seasons skin (Punto di
# rugiada, Pressione, Pioggia, Intensità pioggia, Radiazione solare),
# with one deliberate departure: Feels Like is "Temperatura percepita",
# the term Italian weather services use, where Seasons' "Temperatura
# apparente" is the technical name.  The nine trend.barometer.desc
# descriptions use the tendency vocabulary of Italian weather bulletins
# (in aumento, stabile, in diminuzione); the handful of readout strings
# only this page renders are built from that vocabulary.
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Abbreviazioni dei punti cardinali per station.latitude/longitude
    hemispheres = N, S, E, O

[Units]

    [[Ordinates]]

        # Punti cardinali per i campi .ordinal_compass; la scala del
        # vento e la rosa dei venti della pagina usano N, E, S e O.
        # Come nel file it.conf di WeeWX stesso.
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N.D.

[Almanac]

    # Fasi della luna, per i campi moon_phase di un'istanza di loopdata
    # il cui report di destinazione è questo.
    # Come nel file it.conf di WeeWX stesso.
    moon_phases = Nuova, Crescente, Primo quarto, Gibbosa crescente, Piena, Gibbosa calante, Ultimo quarto, Calante

    # Nomi degli astri, chiave = nome del tag, per i campi
    # almanac.<body>.label.
    sun = Sole
    moon = Luna
    mercury = Mercurio
    venus = Venere
    earth = Terra
    mars = Marte
    jupiter = Giove
    saturn = Saturno
    uranus = Urano
    neptune = Nettuno
    pluto = Plutone
    proxima_centauri = Proxima Centauri

    # Nomi delle costellazioni, chiave = abbreviazione IAU, per i campi
    # almanac.<body>.constellation.label (weewx-skyfield).
    # almanac.<body>.constellation dà sempre il nome latino.
    # La IAU normalizza solo i nomi latini; i nomi italiani seguono la
    # Lista delle costellazioni della Wikipedia in italiano
    # (https://it.wikipedia.org/wiki/Lista_delle_costellazioni,
    # consultata 2026-08-06).  Alternative usuali: Boo Bifolco,
    # Crt Coppa, Dra Drago, Nor Squadra, Oph Serpentario.
