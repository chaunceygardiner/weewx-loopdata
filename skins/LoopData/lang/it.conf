[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Up to date weather readings for {location}." = "Rilevazioni meteo aggiornate per {location}."
    "Today's Windrose" = "Rosa dei venti di oggi"
    "Wind" = "Vento"
    "Temperature" = "Temperatura"
    "Dew Point" = "Punto di rugiada"
    "Humidity" = "Umidità"
    "Barometer" = "Pressione"
    "Rain" = "Pioggia"
