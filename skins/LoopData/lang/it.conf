    #    tendency vocabulary of Italian weather bulletins) ──────────────
    "Rising Very Rapidly" = "in rapidissimo aumento"
    "Rising Quickly" = "in rapido aumento"
    "Rising" = "in aumento"
    "Rising Slowly" = "in lento aumento"
    "Steady" = "stabile"
    "Falling Slowly" = "in lenta diminuzione"
    "Falling" = "in diminuzione"
    "Falling Quickly" = "in rapida diminuzione"
    "Falling Very Rapidly" = "in rapidissima diminuzione"

    # ── live strings (realtime_updater.inc) ──────────────────────────────
    "LIVE" = "IN DIRETTA"
    "{age}s ago" = "{age} s fa"
    "NO DATA (HTTP {status}) — check loop_data_file" = "NESSUN DATO (HTTP {status}) — controlla loop_data_file"
    "BAD DATA — check loop_data_file" = "DATI NON VALIDI — controlla loop_data_file"
    "OFFLINE" = "OFFLINE"
    "CLICK-ME" = "FAI CLIC QUI"
    "calm" = "calma"
    "gust {gust}" = "raffica {gust}"
    "gust {gust} @ {dir}" = "raffica {gust} da {dir}"
    "today" = "oggi"
