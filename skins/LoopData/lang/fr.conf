    "Today's Windrose" = "Rose des vents du jour"
    "Wind" = "Vent"
    "Temperature" = "Température"
    "Dew Point" = "Point de Rosée"
    "Humidity" = "Humidité"
    "Barometer" = "Pression Atmosphérique"
    "Rain" = "Précipitations"
    "Rain Rate" = "Taux de Précipitations"
    "Feels Like" = "Température Ressentie"
    "UV Index" = "Index UV"
    "Solar Radiation" = "Rayonnement Solaire"
    "Air Quality" = "Qualité de l'air"

    # ── live values (read by loopdata itself, from the TARGET report's
    #    [Texts]: the trend.barometer.desc descriptions; terms after the
    #    tendency vocabulary of French weather bulletins) ────────────────
    "Rising Very Rapidly" = "en hausse très rapide"
    "Rising Quickly" = "en hausse rapide"
    "Rising" = "en hausse"
    "Rising Slowly" = "en hausse lente"
    "Steady" = "stationnaire"
    "Falling Slowly" = "en baisse lente"
    "Falling" = "en baisse"
    "Falling Quickly" = "en baisse rapide"
    "Falling Very Rapidly" = "en baisse très rapide"

    # ── live strings (realtime_updater.inc) ──────────────────────────────
    "LIVE" = "EN DIRECT"
    "{age}s ago" = "il y a {age} s"
    "NO DATA (HTTP {status}) — check loop_data_file" = "PAS DE DONNÉES (HTTP {status}) — vérifier loop_data_file"
