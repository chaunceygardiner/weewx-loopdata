# skins/LoopData/lang/fr.conf
#
# French -- Français.
# The shared vocabulary -- body names, moon phases, hemispheres, compass
# ordinates, all 88 constellation names, and the live badge strings -- is
# copied verbatim from weewx-skyfield's and weewx-celestial's lang/fr.conf
# (native-speaker reviewed, 2026-07-30) and must stay in step with them
# (a test pins this).  The gauge headings
# follow the French labels of WeeWX's own Seasons skin (Point de Rosée,
# Pression Atmosphérique, Taux de Précipitations, Index UV, Rayonnement
# Solaire, Température Ressentie); the handful of readout strings only
# this page renders are built from that vocabulary.  Corrections welcome
# at https://github.com/chaunceygardiner/weewx-loopdata/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Abréviations des points cardinaux pour station.latitude/longitude
    hemispheres = N, S, E, O

[Units]

    [[Ordinates]]

        # Points cardinaux pour les champs .ordinal_compass ; l'échelle de
        # vent et la rose des vents utilisent N, E, S et O.
        # Comme dans le fichier fr.conf de WeeWX lui-même.
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N/A

[Almanac]

    # Phases de la Lune, pour les champs moon_phase d'une instance
    # loopdata dont ce rapport est la cible.
    # Comme dans le fichier fr.conf de WeeWX lui-même.
    moon_phases = Nouvelle, Premier croissant, Premier quartier, Gibbeuse croissante, Pleine, Gibbeuse décroissante, Dernier quartier, Dernier croissant

    # Noms d'affichage des astres, clé = nom du tag, pour les champs
    # almanac.<body>.label.
    sun = Soleil
    moon = Lune
    mercury = Mercure
    venus = Vénus
    earth = Terre
    mars = Mars
    jupiter = Jupiter
    saturn = Saturne
    uranus = Uranus
    neptune = Neptune
    pluto = Pluton
    proxima_centauri = Proxima du Centaure

