    "OFFLINE" = "HORS LIGNE"
    "CLICK-ME" = "CLIQUEZ ICI"
    "calm" = "calme"
    "gust {gust}" = "rafale {gust}"
    "gust {gust} @ {dir}" = "rafale {gust} de {dir}"
    "today" = "aujourd'hui"
    "today {min} to {max}" = "aujourd'hui {min} à {max}"
