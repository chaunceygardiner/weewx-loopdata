# skins/LoopData/lang/nl.conf
#
# Dutch -- Nederlands.  Beta pending native-speaker review; corrections
# welcome at https://github.com/chaunceygardiner/weewx-loopdata/issues
#
# The shared vocabulary -- body names, moon phases, hemispheres, compass
# ordinates, all 88 constellation names, and the live badge strings -- is
# copied verbatim from weewx-skyfield's and weewx-celestial's lang/nl.conf
# and must stay in step with them (a test pins this).  The gauge headings
# follow the Dutch labels of WeeWX's own
# Seasons skin (Dauwpunt, Luchtvochtigheid, Regen Intensiteit,
# Zonnestraling, Gevoelstemperatuur); the nine trend.barometer.desc
# descriptions use the tendency vocabulary of Dutch weather reports
# (stijgend, gelijkblijvend, dalend); the handful of readout strings only
# this page renders are built from that vocabulary.
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Afkortingen van de windstreken voor station.latitude/longitude
    hemispheres = N, Z, O, W

[Units]

    [[Ordinates]]

        # Windstreken voor .ordinal_compass-velden; de windschaal en de
        # windroos van de pagina gebruiken N, O, Z en W.
        # Zoals in het nl.conf-bestand van WeeWX zelf.
        directions = N, NNO, NO, ONO, O, OZO, ZO, ZZO, Z, ZZW, ZW, WZW, W, WNW, NW, NNW, N/A

[Almanac]

    # Fasen van de maan, voor de moon_phase-velden van een
    # loopdata-instantie waarvan dit rapport het doelrapport is.
    # Zoals in het nl.conf-bestand van WeeWX zelf.
    moon_phases = Nieuw, Jonge Maansikkel, Eerste Kwartier, Wassende Maan, Vol, Afnemende Maan, Laatste Kwartier, Asgrauwe Maan

    # Weergavenamen van de hemellichamen, sleutel = tagnaam, voor
    # almanac.<body>.label-velden.
    sun = Zon
    moon = Maan
    mercury = Mercurius
    venus = Venus
    earth = Aarde
    mars = Mars
    jupiter = Jupiter
    saturn = Saturnus
    uranus = Uranus
    neptune = Neptunus
    pluto = Pluto
    proxima_centauri = Proxima Centauri

    # Weergavenamen van de sterrenbeelden, sleutel = IAU-afkorting, voor
    # almanac.<body>.constellation.label-velden (weewx-skyfield).
    # almanac.<body>.constellation geeft altijd de Latijnse naam.
    # De IAU normeert alleen de Latijnse namen; de Nederlandse namen
    # volgen de Lijst van sterrenbeelden van de Nederlandstalige
    # Wikipedia (https://nl.wikipedia.org/wiki/Sterrenbeeld,
