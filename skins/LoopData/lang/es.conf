[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Up to date weather readings for {location}." = "Los datos meteorológicos al día para {location}."
    "Today's Windrose" = "Rosa de los vientos de hoy"
    "Wind" = "Viento"
    "Temperature" = "Temperatura"
    "Dew Point" = "Punto de rocío"
    "Humidity" = "Humedad"
    "Barometer" = "Barómetro"
    "Rain" = "Lluvia"
    "Rain Rate" = "Intensidad de lluvia"
    "Feels Like" = "Sensación térmica"
    "UV Index" = "Índice UV"
    "Solar Radiation" = "Radiación solar"
    "Air Quality" = "Calidad del aire"

    # ── live values (read by loopdata itself, from the TARGET report's
    #    [Texts]: the trend.barometer.desc descriptions; terms after the
    #    tendency vocabulary of Spanish weather bulletins) ───────────────
    "Rising Very Rapidly" = "en ascenso muy rápido"
    "Rising Quickly" = "en ascenso rápido"
    "Rising" = "en ascenso"
    "Rising Slowly" = "en ascenso lento"
    "Steady" = "estable"
    "Falling Slowly" = "en descenso lento"
    "Falling" = "en descenso"
    "Falling Quickly" = "en descenso rápido"
    "Falling Very Rapidly" = "en descenso muy rápido"

    # ── live strings (realtime_updater.inc) ──────────────────────────────
    "LIVE" = "EN DIRECTO"
    "{age}s ago" = "hace {age} s"
    "NO DATA (HTTP {status}) — check loop_data_file" = "SIN DATOS (HTTP {status}) — comprueba loop_data_file"
    "BAD DATA — check loop_data_file" = "DATOS NO VÁLIDOS — comprueba loop_data_file"
    "OFFLINE" = "SIN CONEXIÓN"
    "CLICK-ME" = "HAZ CLIC AQUÍ"
    "calm" = "calma"
    "gust {gust}" = "racha {gust}"
    "gust {gust} @ {dir}" = "racha {gust} del {dir}"
    "today" = "hoy"
    "today {min} to {max}" = "hoy de {min} a {max}"
    "max today {max}" = "máx. hoy {max}"
    "rate {rate}" = "intensidad {rate}"
    "pm2.5 {pm25}" = "PM2,5 {pm25}"
