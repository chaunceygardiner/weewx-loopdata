# skins/LoopData/lang/es.conf
#
# Spanish -- Español.  Beta pending native-speaker review; corrections
# welcome at https://github.com/chaunceygardiner/weewx-loopdata/issues
#
# The shared vocabulary -- body names, moon phases, hemispheres, compass
# ordinates, all 88 constellation names, and the live badge strings -- is
# copied verbatim from weewx-skyfield's and weewx-celestial's lang/es.conf
# and must stay in step with them (a test pins this).  The gauge headings
# follow the Spanish labels of WeeWX's own Seasons skin (Punto de rocío,
# Barómetro, Lluvia, Radiación solar), with three deliberate departures:
# Rain Rate is "Intensidad de lluvia" (AEMET's term; Seasons' "Promedio
# de lluvia" reads as an average), Feels Like is "Sensación térmica"
# (the everyday synonym Seasons itself lists for its "Temperatura
# aparente"), and UV Index is the usual short "Índice UV" (Seasons
# spells out "Índice ultravioleta (UV)").  The nine trend.barometer.desc
# descriptions use the tendency vocabulary of Spanish weather bulletins
# (en ascenso, estable, en descenso); the handful of readout strings only
# this page renders are built from that vocabulary.
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Abreviaturas de los puntos cardinales para station.latitude/longitude
    hemispheres = N, S, E, O

[Units]

    [[Ordinates]]

        # Puntos cardinales para los campos .ordinal_compass; la escala de
        # viento y la rosa de los vientos usan N, E, S y O.
        # Como en el archivo es.conf del propio WeeWX.
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N/A

[Almanac]

    # Fases de la luna, para los campos moon_phase de una instancia de
    # loopdata cuyo informe de destino sea este.
    # Como en el archivo es.conf del propio WeeWX.
    moon_phases = Nueva, Creciente, Cuarto creciente, Creciente gibosa, Llena, Menguante gibosa, Cuarto menguante, Menguante

    # Nombres de los astros, clave = nombre del tag, para los campos
    # almanac.<body>.label.
    sun = Sol
    moon = Luna
    mercury = Mercurio
    venus = Venus
    earth = Tierra
    mars = Marte
    jupiter = Júpiter
    saturn = Saturno
    uranus = Urano
    neptune = Neptuno
    pluto = Plutón
    proxima_centauri = Próxima Centauri

    # Nombres de las constelaciones, clave = abreviatura IAU, para los
    # campos almanac.<body>.constellation.label (weewx-skyfield).
    # almanac.<body>.constellation da siempre el nombre latino.
    # La IAU solo normaliza los nombres latinos; los nombres españoles
    # siguen el Anexo:Constelaciones de la Wikipedia en español
    # (https://es.wikipedia.org/wiki/Anexo:Constelaciones, consultado
    # 2026-07-31), sin el artículo y con la primera forma cuando la
    # lista da dos (Leo o León -> Leo).  Alternativas usuales:
    # Sco Escorpión, Vul Zorra, Dor Dorado, Phe Fénix, Pic Pintor.
