[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "Up to date weather readings for {location}." = "Aktuelle Wetterwerte für {location}."
    "Today's Windrose" = "Windrose heute"
    "Wind" = "Wind"
    "Temperature" = "Temperatur"
    "Dew Point" = "Taupunkt"
    "Humidity" = "Luftfeuchte"
    "Barometer" = "Luftdruck"
    "Rain" = "Regen"
    "Rain Rate" = "Regen-Rate"
    "Feels Like" = "Gefühlte Temperatur"
    "UV Index" = "UV-Index"
    "Solar Radiation" = "Sonnenstrahlung"
    "Air Quality" = "Luftqualität"

    # ── live values (read by loopdata itself, from the TARGET report's
