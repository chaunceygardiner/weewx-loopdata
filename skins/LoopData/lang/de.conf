    "Rising Quickly" = "stark steigend"
    "Rising" = "steigend"
    "Rising Slowly" = "langsam steigend"
    "Steady" = "gleichbleibend"
    "Falling Slowly" = "langsam fallend"
    "Falling" = "fallend"
    "Falling Quickly" = "stark fallend"
    "Falling Very Rapidly" = "sehr stark fallend"

    # ── live strings (realtime_updater.inc) ──────────────────────────────
