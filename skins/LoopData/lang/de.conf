# skins/LoopData/lang/de.conf
#
# German -- Deutsch.  The shared vocabulary -- body names, moon phases,
# hemispheres, compass ordinates, all 88 constellation names, and the
# live badge strings -- is copied verbatim from weewx-skyfield's and
# weewx-celestial's lang/de.conf (native-speaker reviewed, 2026-07-28)
# and must stay in step with them (a test pins this).  The gauge
# headings follow the German labels of WeeWX's own Seasons skin
# (Taupunkt, Luftdruck, Regen-Rate, UV-Index, Sonnenstrahlung, gefühlte
# Temperatur); the handful of readout strings only this page renders are
# built from that vocabulary.  Corrections welcome at
# https://github.com/chaunceygardiner/weewx-loopdata/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Abkuerzungen der Himmelsrichtungen fuer station.latitude/longitude
    hemispheres = N, S, O, W

[Units]

    [[Ordinates]]

        # Himmelsrichtungen fuer .ordinal_compass-Felder; Windskala und
        # Windrose der Seite verwenden N, O, S und W
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSW, SW, WSW, W, WNW, NW, NNW, N/A

[Almanac]

    # Mondphasen, fuer moon_phase-Felder einer loopdata-Instanz, deren
    # Ziel-Report dieser Report ist
    moon_phases = Neumond, zunehmende Sichel, erstes Viertel, zunehmender Mond, Vollmond, abnehmender Mond, letztes Viertel, abnehmende Sichel

    # Anzeigenamen der Koerper, Schluessel = Tag-Name, fuer
    # almanac.<body>.label-Felder.  Sonne und Mond wie im Seasons-Skin von
    # WeeWX; die Planetennamen nach der Liste der Planeten des
    # Sonnensystems der deutschsprachigen Wikipedia
    # (https://de.wikipedia.org/wiki/Liste_der_Planeten_des_Sonnensystems,
    # abgerufen 2026-07-28).
    sun = Sonne
    moon = Mond
    mercury = Merkur
    venus = Venus
    earth = Erde
    mars = Mars
    jupiter = Jupiter
    saturn = Saturn
    uranus = Uranus
    neptune = Neptun
    pluto = Pluto
    proxima_centauri = Proxima Centauri

    # Anzeigenamen der Sternbilder, Schluessel = IAU-Kuerzel, fuer
    # almanac.<body>.constellation.label-Felder (weewx-skyfield).
    # almanac.<body>.constellation liefert immer den lateinischen Namen.
    # Die IAU normiert nur die lateinischen Namen; die deutschen folgen
    # der Liste der Sternbilder der deutschsprachigen Wikipedia
    # (https://de.wikipedia.org/wiki/Liste_der_Sternbilder, abgerufen
    # 2026-07-28).
