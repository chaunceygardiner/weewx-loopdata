title: WeeWX LoopData
description: >-
  Live loop-packet data for WeeWX skins — current, trend, rolling-window,
  span, windrose, almanac and station values, unit-converted and formatted
  per your report, written to a json file on every loop packet.
url: "https://chaunceygardiner.github.io"
baseurl: "/weewx-loopdata"

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

search_enabled: true
heading_anchors: true

aux_links:
  "weewx-loopdata on GitHub":
    - "https://github.com/chaunceygardiner/weewx-loopdata"
aux_links_new_tab: true

# External links shown at the bottom of the left sidebar nav, on every page.
nav_external_links:
  - title: weewx-loopdata on GitHub
    url: https://github.com/chaunceygardiner/weewx-loopdata
  - title: Download weewx-loopdata.zip
    url: https://github.com/chaunceygardiner/weewx-loopdata/releases/latest/download/weewx-loopdata.zip

callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: red
  tip:
    title: Tip
    color: green

footer_content: >-
  weewx-loopdata is Copyright &copy; 2020&ndash;2026 John A Kline and is
  licensed under the GNU Public License v3.
